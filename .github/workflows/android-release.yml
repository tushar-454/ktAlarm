name: ktAlarm Android Release

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: write

jobs:
    release:
        name: Build and Publish APK
        runs-on: ubuntu-latest
        timeout-minutes: 360

        env:
            EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
            GH_TOKEN: ${{ github.token }}
            CI: "1"

        steps:
            # 1. Checkout repository
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # 2. Setup Node.js
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm

            # 3. Install dependencies
            - name: Install dependencies
              run: npm ci

            # 4. Install EAS CLI directly
            # Avoids Expo GitHub Action cache issues
            - name: Install EAS CLI
              timeout-minutes: 15
              run: |
                  npm install --global eas-cli@27.10.0 \
                    --no-audit \
                    --no-fund

                  eas --version

            # 5. Verify Expo token
            - name: Verify Expo authentication
              run: |
                  if [ -z "$EXPO_TOKEN" ]; then
                    echo "EXPO_TOKEN GitHub secret is missing"
                    exit 1
                  fi

                  eas whoami
                  eas project:info

            # 6. Fix TypeScript CSS import declarations
            - name: Prepare CSS type declarations
              shell: bash
              run: |
                  if [ ! -f src/global.css ]; then
                    echo "ERROR: src/global.css is missing"
                    exit 1
                  fi

                  if [ ! -f src/css.d.ts ]; then
                    printf 'declare module "*.css";\n' > src/css.d.ts
                  fi

                  echo "CSS type declarations ready"

            # 7. Validate TypeScript and ESLint
            - name: TypeScript and ESLint
              run: |
                  npx tsc --noEmit
                  npm run lint

            # 8. Validate EAS configuration
            - name: Verify EAS configuration
              run: |
                  node <<'NODE'
                  const eas = require("./eas.json");

                  if (eas.cli?.appVersionSource !== "remote") {
                    throw new Error("Remote versioning is required");
                  }

                  if (eas.build?.preview?.android?.buildType !== "apk") {
                    throw new Error("Preview must build APK");
                  }

                  const increment =
                    eas.build.preview.android.autoIncrement;

                  if (
                    increment !== true &&
                    increment !== "versionCode"
                  ) {
                    throw new Error("Android autoIncrement is disabled");
                  }

                  console.log("EAS configuration valid");
                  NODE

            # 9. Generate release version
            - name: Generate release version
              id: version
              shell: bash
              run: |
                  BASE=$(node -p "require('./package.json').version")

                  if [[ ! "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Invalid package.json version: $BASE"
                    exit 1
                  fi

                  MAJOR="${BASE%%.*}"
                  REST="${BASE#*.}"
                  MINOR="${REST%%.*}"
                  PATCH="${REST##*.}"

                  NEXT_PATCH=$((10#$PATCH + GITHUB_RUN_NUMBER))

                  VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
                  TAG="v${VERSION}"

                  if gh release view "$TAG" >/dev/null 2>&1; then
                    echo "Release already exists: $TAG"
                    exit 1
                  fi

                  if git rev-parse --verify \
                    "refs/tags/$TAG" >/dev/null 2>&1; then
                    echo "Git tag already exists: $TAG"
                    exit 1
                  fi

                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"

                  echo "New release: $TAG"

            # 10. Update Android versionName
            # EAS remote versionCode increments separately
            - name: Update Android versionName
              env:
                  RELEASE_VERSION: ${{ steps.version.outputs.version }}
              run: |
                  python3 <<'PY'
                  import json
                  import os
                  import re
                  from pathlib import Path

                  version = os.environ["RELEASE_VERSION"]

                  gradle_path = Path("android/app/build.gradle")
                  gradle = gradle_path.read_text()

                  gradle, count = re.subn(
                      r'(?m)^(\s*versionName\s+)"[^"]+"',
                      lambda m: m.group(1) + f'"{version}"',
                      gradle,
                      count=1,
                  )

                  if count != 1:
                      raise RuntimeError(
                          "Android versionName not found"
                      )

                  gradle_path.write_text(gradle)

                  app_path = Path("app.json")
                  app = json.loads(app_path.read_text())
                  app["expo"]["version"] = version

                  app_path.write_text(
                      json.dumps(
                          app,
                          indent=2,
                          ensure_ascii=False,
                      ) + "\n"
                  )

                  print(f"Android versionName: {version}")
                  PY

            # 11. Build signed APK using EAS Preview
            - name: Build signed Android APK
              id: build
              shell: bash
              run: |
                  eas build \
                    --platform android \
                    --profile preview \
                    --non-interactive \
                    --freeze-credentials \
                    --wait \
                    --json > eas-build.json

                  BUILD_ID=$(jq -er '
                    if type == "array" then
                      .[0].id
                    else
                      .id
                    end
                  ' eas-build.json)

                  echo "EAS Build ID: $BUILD_ID"

                  eas build:view "$BUILD_ID" \
                    --json > eas-result.json

                  STATUS=$(jq -r \
                    '.status // "" | ascii_upcase' \
                    eas-result.json)

                  APK_URL=$(jq -r \
                    '.artifacts.buildUrl // empty' \
                    eas-result.json)

                  if [[ "$STATUS" != "FINISHED" ]]; then
                    echo "EAS build failed: $STATUS"
                    exit 1
                  fi

                  if [[ -z "$APK_URL" ]]; then
                    echo "APK download URL is missing"
                    exit 1
                  fi

                  echo "id=$BUILD_ID" >> "$GITHUB_OUTPUT"
                  echo "url=$APK_URL" >> "$GITHUB_OUTPUT"

            # 12. Download APK
            - name: Download APK
              env:
                  APK_URL: ${{ steps.build.outputs.url }}
              shell: bash
              run: |
                  mkdir -p dist

                  curl \
                    --fail \
                    --location \
                    --retry 3 \
                    --retry-all-errors \
                    "$APK_URL" \
                    --output dist/ktAlarm.apk

                  APK_SIZE=$(stat -c%s dist/ktAlarm.apk)

                  if [ "$APK_SIZE" -lt 1000000 ]; then
                    echo "Downloaded APK is unexpectedly small"
                    exit 1
                  fi

                  unzip -tqq dist/ktAlarm.apk

                  echo "APK integrity check passed"

            # 13. Generate SHA256 checksum
            - name: Generate checksum
              run: |
                  cd dist
                  sha256sum ktAlarm.apk > SHA256SUMS.txt

            # 14. Generate release notes
            - name: Generate release notes
              env:
                  RELEASE_VERSION: ${{ steps.version.outputs.version }}
                  BUILD_ID: ${{ steps.build.outputs.id }}
              shell: bash
              run: |
                  PREVIOUS_TAG=$(
                    gh release view \
                      --json tagName \
                      --jq '.tagName' 2>/dev/null || true
                  )

                  {
                    echo "# ktAlarm v${RELEASE_VERSION}"
                    echo
                    echo "Automated Android APK release."
                    echo
                    echo "## Build information"
                    echo
                    echo "- Version: ${RELEASE_VERSION}"
                    echo "- Profile: preview"
                    echo "- Commit: ${GITHUB_SHA}"
                    echo "- EAS Build ID: ${BUILD_ID}"
                    echo
                    echo "## What's Changed"
                    echo

                    if [[ -n "$PREVIOUS_TAG" ]] && \
                       git rev-parse --verify \
                       "${PREVIOUS_TAG}^{commit}" \
                       >/dev/null 2>&1 && \
                       git merge-base --is-ancestor \
                       "$PREVIOUS_TAG" "$GITHUB_SHA"; then

                      git log \
                        "${PREVIOUS_TAG}..${GITHUB_SHA}" \
                        --format='- %s (%h)' \
                        --max-count=100
                    else
                      git log \
                        "$GITHUB_SHA" \
                        --format='- %s (%h)' \
                        --max-count=25
                    fi

                    echo
                    echo "## Downloads"
                    echo
                    echo "- ktAlarm.apk"
                    echo "- SHA256SUMS.txt"
                  } > release-notes.md

            # 15. Publish GitHub Release
            - name: Publish GitHub Release
              env:
                  RELEASE_TAG: ${{ steps.version.outputs.tag }}
                  RELEASE_VERSION: ${{ steps.version.outputs.version }}
              shell: bash
              run: |
                  gh release create "$RELEASE_TAG" \
                    dist/ktAlarm.apk \
                    dist/SHA256SUMS.txt \
                    --target "$GITHUB_SHA" \
                    --title "ktAlarm v${RELEASE_VERSION}" \
                    --notes-file release-notes.md

                  echo "Release published: $RELEASE_TAG"
