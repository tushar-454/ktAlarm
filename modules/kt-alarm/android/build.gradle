plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ktalarm'
version = '1.0.0'

android {
  namespace "expo.modules.ktalarm"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Camera preview + frame analysis for the barcode mission and code registration.
  def cameraxVersion = "1.4.2"
  implementation "androidx.camera:camera-camera2:$cameraxVersion"
  implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
  implementation "androidx.camera:camera-view:$cameraxVersion"
  // Bundled model (not the Play-services one): scans offline and on first launch.
  implementation "com.google.mlkit:barcode-scanning:17.3.0"
}
