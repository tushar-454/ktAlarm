plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.ktalarm'
version = '1.0.0'

android {
  namespace "expo.modules.ktalarm"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    // Keeps ML Kit working when the app is minified (release / EAS builds).
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  // Camera preview + frame analysis for the barcode and squat missions and code registration.
  def cameraxVersion = "1.4.2"
  implementation "androidx.camera:camera-camera2:$cameraxVersion"
  implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
  implementation "androidx.camera:camera-view:$cameraxVersion"
  // Bundled models (not the Play-services ones): work offline and on first launch.
  implementation "com.google.mlkit:barcode-scanning:17.3.0"
  // Body landmarks for counting squats in front of the camera.
  implementation "com.google.mlkit:pose-detection:18.0.0-beta5"
  // Pose detection pulls in WorkManager 2.7 / Room 2.2 (via com.google.mlkit:acceleration), whose
  // R8 rules don't hold up under R8 full mode: minified builds crashed on launch. Newer versions
  // ship correct rules.
  implementation "androidx.work:work-runtime:2.11.2"
  implementation "androidx.work:work-multiprocess:2.11.2"

  testImplementation "junit:junit:4.13.2"
}
